<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--bolt)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg>
      </div>
      <div class="title">
        <h1>光鸭闪推</h1>
      </div>
      <button id="btnOptions" class="icon-btn" title="设置">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9.5" cy="7" r="2.2" fill="var(--paper)"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.2" fill="var(--paper)"/></svg>
      </button>
    </header>

    <div class="status-row">
      <img id="userAvatar" class="avatar hidden" alt="" referrerpolicy="no-referrer" />
      <div id="userStatus" class="status pending"></div>
    </div>

    <section class="card">
      <div class="push-row">
        <input id="pushInput" type="text" placeholder="粘贴磁力 / ed2k / 迅雷链接" spellcheck="false" />
        <button id="btnPush" class="primary">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg>
          推送
        </button>
      </div>

      <button id="folderBtn" class="folder-btn" title="点击选择保存目录">
        <svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="folderLabel">默认（云下载）</span>
        <span class="folder-change">更改</span>
      </button>

      <div id="folderPicker" class="folder-picker hidden">
        <div class="fp-head">
          <button id="fpUp" class="icon-btn" title="返回上一级">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
          <span id="fpPath" class="fp-path">全部文件</span>
          <button id="fpClose" class="icon-btn" title="关闭">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
        </div>
        <ul id="fpList" class="fp-list"></ul>
        <div class="fp-foot">
          <button id="fpReset" class="text-btn">恢复默认</button>
          <button id="fpChoose" class="primary small">保存到此目录</button>
        </div>
      </div>

      <div id="confirmBox" class="confirm-box hidden">
        <div class="confirm-label">确认推送</div>
        <div id="confirmInfo" class="confirm-info"></div>
        <div class="confirm-actions">
          <button id="btnCancelConfirm" class="text-btn">取消</button>
          <button id="btnDoConfirm" class="primary small">确认推送</button>
        </div>
      </div>

      <div id="pushMsg" class="msg"></div>
    </section>

    <section class="card" id="pageCard">
      <div class="row-between">
        <span class="page-label">本页发现 <b id="pageCount">…</b> 个链接</span>
        <span class="btn-group">
          <button id="btnRescan" class="icon-btn" title="重新扫描本页">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
          <button id="btnPushAll" class="outline" disabled>全部推送</button>
        </span>
      </div>
    </section>

    <section class="card">
      <div class="row-between sec-head">
        <span class="sec-label">最近任务</span>
        <button id="btnRefreshTasks" class="icon-btn" title="刷新">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><polyline points="21 3 21 9 15 9"/></svg>
        </button>
      </div>
      <ul id="taskList" class="task-list"></ul>
    </section>

    <footer>
      <span id="verInfo"></span>
      <span>·</span>
      <a id="githubLink" href="#" title="打开 GitHub 项目主页">GitHub</a>
      <button id="btnCheckUpdate" class="footer-link" type="button">检查更新</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
